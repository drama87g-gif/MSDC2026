version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: msdc-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - msdc

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: msdc-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      FLASK_ENV: production
      PYTHONUNBUFFERED: 1
      INIT_DB: "1"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - msdc
    command: >
      sh -c "python /app/app.py"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: msdc-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - msdc

volumes:
  db_data:

networks:
  msdc:
    driver: bridge
